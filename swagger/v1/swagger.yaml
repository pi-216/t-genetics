---
openapi: 3.0.1
info:
  title: TGenetics API
  version: v1
paths:
  "/api/v1/chromosomes":
    get:
      summary: List chromosomes (token auth)
      tags:
      - Chromosomes
      security:
      - bearerAuth: []
      description: |
        Lists the chromosomes of the token's organization.

        Authenticate with an org-scoped API token. Send
        `Authorization: Bearer PLAINTEXT` where PLAINTEXT is the token value
        shown once at creation. A missing, invalid, or revoked token receives
        401; chromosomes of other organizations are never visible.
      responses:
        '200':
          description: chromosomes listed
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/Chromosome"
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Errors"
  "/api/v1/experiments/{id}/suggestion":
    post:
      summary: Request a suggestion (token auth)
      tags:
      - Experiments
      security:
      - bearerAuth: []
      description: |
        Requests the next organism to test from the token organization's
        experiment. The engine suggests the least-tested organism of the
        current generation and records the suggestion as a PerformanceLog; the
        customer then tests the organism on their own infrastructure and
        reports the single fitness number via the outcome endpoint.

        Authenticate with an org-scoped API token
        (`Authorization: Bearer <token>`). A missing, invalid, or revoked
        token receives 401; an experiment outside the token's organization —
        or an unknown id — answers 404 with error keys; an experiment without
        a current generation answers 422 with error keys.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      - name: Authorization
        in: header
        description: Bearer token (org-scoped machine API token)
        schema:
          type: string
      responses:
        '200':
          description: suggestion returned (organism with values)
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Organism"
        '404':
          description: experiment not found (or outside the token org)
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Errors"
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Errors"
        '422':
          description: experiment has no current generation
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Errors"
  "/api/v1/performance_logs/{id}/outcome":
    post:
      summary: Report a fitness outcome (token auth)
      tags:
      - Performance Logs
      security:
      - bearerAuth: []
      description: |
        Reports the single fitness number a customer measured for the suggested
        organism (the PerformanceLog the suggestion request created). This is
        the only fitness-bearing input in the product — we never evaluate
        anyone's fitness function.

        Authenticate with an org-scoped API token
        (`Authorization: Bearer PLAINTEXT`). A missing, invalid, or revoked
        token receives 401; a log outside the token's organization answers 404;
        a missing or non-numeric `fitness_input_value` answers 422 with error
        keys. Reporting again overwrites the previously recorded value.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: outcome recorded
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/PerformanceLog"
        '404':
          description: performance log not found (or outside the token org)
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Errors"
        '401':
          description: unauthorized
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Errors"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - performance_log
              properties:
                performance_log:
                  type: object
                  required:
                  - fitness_input_value
                  properties:
                    fitness_input_value:
                      type: number
                      description: The customer-reported fitness number (e.g. 0.81)
  "/chromosomes":
    get:
      summary: List chromosomes
      tags:
      - Chromosomes
      description: |
        Lists chromosomes (the top-level "genome template").

        A chromosome contains alleles (parameters) and generations (population snapshots).
        Typical workflow: create chromosome → add alleles → create first generation → update fitness → procreate.
      responses:
        '200':
          description: chromosomes listed
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/Chromosome"
    post:
      summary: Create chromosome
      tags:
      - Chromosomes
      description: |
        Creates a new chromosome container.

        After creating the chromosome, you typically create alleles under it and then bootstrap the first generation.
      parameters: []
      responses:
        '201':
          description: chromosome created
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Chromosome"
        '422':
          description: invalid request
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Errors"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - chromosome
              properties:
                chromosome:
                  type: object
                  required:
                  - name
                  properties:
                    name:
                      type: string
  "/chromosomes/{id}":
    parameters:
    - name: id
      in: path
      required: true
      schema:
        type: integer
    get:
      summary: Show chromosome
      tags:
      - Chromosomes
      description: |
        Fetches a single chromosome, including its allele definitions.

        Use this to discover the parameter space (alleles) before creating organisms and setting fitness.
      responses:
        '200':
          description: chromosome found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Chromosome"
        '404':
          description: not found
    patch:
      summary: Update chromosome
      tags:
      - Chromosomes
      description: |
        Updates chromosome metadata.

        This does not modify existing generations/organisms; it only updates the chromosome record (currently: name).
      parameters: []
      responses:
        '200':
          description: chromosome updated
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Chromosome"
        '422':
          description: invalid request
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Errors"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - chromosome
              properties:
                chromosome:
                  type: object
                  properties:
                    name:
                      type: string
    delete:
      summary: Delete chromosome
      tags:
      - Chromosomes
      description: |
        Deletes a chromosome and all nested resources (alleles, generations, organisms).

        Use with care: this is a destructive reset of the entire experiment.
      responses:
        '204':
          description: chromosome deleted
  "/chromosomes/{chromosome_id}/alleles":
    parameters:
    - name: chromosome_id
      in: path
      required: true
      schema:
        type: integer
    get:
      summary: List alleles
      tags:
      - Alleles
      description: |
        Lists all alleles for a chromosome.

        Alleles define the "search space" (parameters) that each organism will carry values for.
      responses:
        '200':
          description: alleles listed
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/Allele"
    post:
      summary: Create allele
      tags:
      - Alleles
      parameters: []
      description: |
        Creates an allele within the chromosome using a typed request body.

        Supported `type` values:
        - `Integer` (requires `minimum` + `maximum`)
        - `Float` (requires `minimum` + `maximum`)
        - `Boolean` (no additional fields)
        - `Option` (requires `choices`)
      responses:
        '201':
          description: allele created
          content:
            application/json:
              examples:
                integer:
                  value:
                    id: 1
                    chromosome_id: 1
                    name: legs
                    type: Integer
                    minimum: 1
                    maximum: 50
                float:
                  value:
                    id: 2
                    chromosome_id: 1
                    name: height
                    type: Float
                    minimum: 1.0
                    maximum: 10.0
                boolean:
                  value:
                    id: 3
                    chromosome_id: 1
                    name: flies
                    type: Boolean
                option:
                  value:
                    id: 4
                    chromosome_id: 1
                    name: color
                    type: Option
                    choices:
                    - green
                    - blue
              schema:
                "$ref": "#/components/schemas/Allele"
        '422':
          description: invalid request
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Errors"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - allele
              properties:
                allele:
                  type: object
                  required:
                  - name
                  - type
                  properties:
                    name:
                      type: string
                    type:
                      type: string
                      description: One of Integer|Float|Boolean|Option
                    minimum:
                      type: number
                      nullable: true
                    maximum:
                      type: number
                      nullable: true
                    choices:
                      type: array
                      items:
                        type: string
                      nullable: true
            examples:
              integer:
                summary: Integer allele
                value:
                  allele:
                    name: legs
                    type: Integer
                    minimum: 1
                    maximum: 50
              float:
                summary: Float allele
                value:
                  allele:
                    name: height
                    type: Float
                    minimum: 1.0
                    maximum: 10.0
              boolean:
                summary: Boolean allele
                value:
                  allele:
                    name: flies
                    type: Boolean
              option:
                summary: Option allele
                value:
                  allele:
                    name: color
                    type: Option
                    choices:
                    - green
                    - blue
  "/chromosomes/{chromosome_id}/alleles/{id}":
    parameters:
    - name: chromosome_id
      in: path
      required: true
      schema:
        type: integer
    - name: id
      in: path
      required: true
      schema:
        type: integer
    get:
      summary: Show allele
      tags:
      - Alleles
      description: |
        Fetches a single allele definition within a chromosome.

        Useful for inspecting constraints (e.g., min/max or option choices) before creating/updating organisms.
      responses:
        '200':
          description: allele found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Allele"
        '404':
          description: not found
    patch:
      summary: Update allele
      tags:
      - Alleles
      description: |
        Updates an existing allele.

        Rules:
        - You may change the allele name and constraints within its current type.
        - You may NOT change the allele type (e.g., Integer → Float).
      parameters: []
      responses:
        '200':
          description: allele updated
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Allele"
        '422':
          description: type cannot be changed
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Errors"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - allele
              properties:
                allele:
                  type: object
                  properties:
                    name:
                      type: string
                    type:
                      type: string
                    minimum:
                      type: number
                      nullable: true
                    maximum:
                      type: number
                      nullable: true
                    choices:
                      type: array
                      items:
                        type: string
                      nullable: true
    delete:
      summary: Delete allele
      tags:
      - Alleles
      description: |
        Deletes an allele from a chromosome.

        Note: existing organism values for this allele (in existing generations) may become incomplete.
      responses:
        '204':
          description: allele deleted
  "/chromosomes/{chromosome_id}/generations":
    parameters:
    - name: chromosome_id
      in: path
      required: true
      schema:
        type: integer
    get:
      summary: List generations
      tags:
      - Generations
      description: |
        Lists generations for a chromosome.

        A generation is a snapshot/iteration of a population of organisms.
        Use `POST /chromosomes/{chromosome_id}/generations` to create the first generation, then `procreate` to create subsequent generations.
      responses:
        '200':
          description: generations listed
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/Generation"
    post:
      summary: Create first generation
      tags:
      - Generations
      description: |
        Bootstraps the first generation for a chromosome.

        Behavior:
        - Allowed only if the chromosome has zero generations.
        - Creates `iteration = 1` and seeds an initial population of organisms (currently 20).

        If a generation already exists, you should use `procreate` from an existing generation instead of creating multiple "generation 1" roots.
      responses:
        '201':
          description: generation created
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Generation"
        '409':
          description: generation already exists
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Errors"
  "/chromosomes/{chromosome_id}/generations/{id}":
    parameters:
    - name: chromosome_id
      in: path
      required: true
      schema:
        type: integer
    - name: id
      in: path
      required: true
      schema:
        type: integer
    get:
      summary: Show generation
      tags:
      - Generations
      description: |
        Fetches a generation record.

        Note: this endpoint returns generation metadata (id, chromosome_id). Use the organisms endpoints to inspect the population.
      responses:
        '200':
          description: generation found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Generation"
  "/chromosomes/{chromosome_id}/generations/{id}/procreate":
    parameters:
    - name: chromosome_id
      in: path
      required: true
      schema:
        type: integer
    - name: id
      in: path
      required: true
      schema:
        type: integer
    post:
      summary: Procreate a new generation
      tags:
      - Generations
      description: |
        Creates a new generation derived from a parent generation.

        This is the main "evolution" step:
        - Selects parents from the parent generation (based on fitness)
        - Produces a new population in a newly created generation

        After creating the offspring generation, update fitness values for its organisms and procreate again.
      responses:
        '201':
          description: offspring generation created
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Generation"
  "/chromosomes/{chromosome_id}/generations/{generation_id}/organisms":
    parameters:
    - name: chromosome_id
      in: path
      required: true
      schema:
        type: integer
    - name: generation_id
      in: path
      required: true
      schema:
        type: integer
    get:
      summary: List organisms
      tags:
      - Organisms
      description: |
        Lists organisms in a generation.

        An organism represents one candidate solution (one set of allele values).
        Use `PATCH /.../organisms/{id}` to update fitness after evaluating the organism externally.
      responses:
        '200':
          description: organisms listed
          content:
            application/json:
              schema:
                type: array
                items:
                  "$ref": "#/components/schemas/Organism"
  "/chromosomes/{chromosome_id}/generations/{generation_id}/organisms/{id}":
    parameters:
    - name: chromosome_id
      in: path
      required: true
      schema:
        type: integer
    - name: generation_id
      in: path
      required: true
      schema:
        type: integer
    - name: id
      in: path
      required: true
      schema:
        type: integer
    get:
      summary: Show organism
      tags:
      - Organisms
      description: |
        Fetches a single organism's current allele values.

        This is what you feed into your external evaluation (e.g., model/sampler/scheduler hyperparameters).
      responses:
        '200':
          description: organism found
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Organism"
    patch:
      summary: Update organism fitness
      tags:
      - Organisms
      description: |
        Updates an organism's fitness score.

        Fitness is the signal used for selection when procreating the next generation.
        Higher fitness means the organism is more likely to be selected as a parent.
      parameters: []
      responses:
        '200':
          description: organism updated
          content:
            application/json:
              schema:
                "$ref": "#/components/schemas/Organism"
        '400':
          description: missing organism param
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
              - organism
              properties:
                organism:
                  type: object
                  properties:
                    fitness:
                      type: number
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: string
  schemas:
    Chromosome:
      type: object
      required:
      - id
      - name
      - alleles
      properties:
        id:
          type: integer
        name:
          type: string
        alleles:
          type: array
          items:
            "$ref": "#/components/schemas/Allele"
    Allele:
      type: object
      required:
      - id
      - chromosome_id
      - name
      - type
      properties:
        id:
          type: integer
        chromosome_id:
          type: integer
        name:
          type: string
        type:
          type: string
        minimum:
          type: number
          nullable: true
        maximum:
          type: number
          nullable: true
        choices:
          type: array
          items:
            type: string
          nullable: true
    Generation:
      type: object
      required:
      - id
      - chromosome_id
      properties:
        id:
          type: integer
        chromosome_id:
          type: integer
    Organism:
      type: object
      additionalProperties:
        oneOf:
        - type: string
        - type: number
        - type: boolean
        - type: 'null'
    PerformanceLog:
      type: object
      required:
      - id
      - experiment_id
      - organism_id
      - suggested_at
      properties:
        id:
          type: integer
        experiment_id:
          type: integer
        organism_id:
          type: integer
        suggested_at:
          type: string
          format: date-time
        fitness_input_value:
          type: number
          nullable: true
        outcome_metrics:
          type: object
          nullable: true
        outcome_recorded_at:
          type: string
          format: date-time
          nullable: true
    Errors:
      type: object
      properties:
        errors:
          oneOf:
          - type: array
            items:
              type: string
          - type: object
servers:
- url: http://{defaultHost}
  variables:
    defaultHost:
      default: localhost:3001
